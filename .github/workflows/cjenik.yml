name: Objava cjenika

# Odluka NN 101/2026 traži objavu svakog radnog dana najkasnije do 8:00.
# Cron je u UTC-u. Glavna objava 03:30 UTC = 05:30 ljeti (CEST), 04:30 zimi (CET).
# Kontrolna 04:30 UTC = 06:30 ljeti, 05:30 zimi — rezerva ako GitHub
# preskoči ili jako zakasni s glavnom; i ona ima sat i pol zalihe do 8:00.
# Zakazano pokretanje (i vanjski okidač s rezerva=true) se preskače ako je
# danas već objavljeno; ručno pokretanje bez tog inputa uvijek objavljuje.
on:
  schedule:
    - cron: '30 3 * * 1-5'
    - cron: '30 4 * * 1-5'
  workflow_dispatch:
    inputs:
      rezerva:
        description: 'SAMO za vanjski okidač — ručno ostavi prazno (inače preskače ako je danas već objavljeno)'
        type: boolean
        default: false

permissions:
  contents: write   # commit objave u repozitorij (trag u povijesti)
  pages: write      # objava na GitHub Pages
  id-token: write   # deploy-pages traži OIDC token

concurrency:
  group: cjenik
  cancel-in-progress: false

env:
  # Runner je u UTC-u. Bez ovoga bi vrijeme u nazivu arhivirane datoteke
  # bilo UTC, a Odluka traži stvarno vrijeme objave.
  TZ: Europe/Zagreb

jobs:
  pripremi:
    runs-on: ubuntu-latest
    outputs:
      preskoci: ${{ steps.provjera.outputs.preskoci }}
    steps:
      - uses: actions/checkout@v4

      # concurrency ceka da prethodni run zavrsi, pa checkout vec vidi
      # danasnju arhivu ako je objava prosla.
      - name: Provjeri je li danas već objavljeno
        id: provjera
        if: github.event_name == 'schedule' || inputs.rezerva
        run: |
          if ls public/arhiva/*_"$(date +%Y%m%d)"-*.csv >/dev/null 2>&1; then
            echo "Danas je već objavljeno, preskačem."
            echo "preskoci=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.provjera.outputs.preskoci != 'true'
        with:
          node-version: '22'

      - name: Generiraj cjenik
        if: steps.provjera.outputs.preskoci != 'true'
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: node scripts/generate-cjenik.mjs

      - name: Commitaj objavu
        if: steps.provjera.outputs.preskoci != 'true'
        run: |
          git config user.name  "cjenik-bot"
          git config user.email "cjenik-bot@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Cjenik $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Spremi za objavu
        if: steps.provjera.outputs.preskoci != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  objavi:
    needs: pripremi
    if: needs.pripremi.outputs.preskoci != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - name: Objavi na GitHub Pages
        id: objava
        uses: actions/deploy-pages@v4
