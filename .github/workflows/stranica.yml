name: Objava stranice

# Kad se ručno promijeni izgled (stil, logo, naslovnica), objavi public/ na
# Pages bez generiranja novog cjenika. Bot commitovi iz "Objava cjenika" idu
# preko GITHUB_TOKEN-a i ne okidaju ovaj workflow, pa nema petlje.
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/stranica.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ista grupa kao objava cjenika, da se dvije objave na Pages ne preklope.
concurrency:
  group: cjenik
  cancel-in-progress: false

jobs:
  # Upload i deploy u odvojenim jobovima: u istom jobu deploy-pages zna ne
  # vidjeti upravo uploadani artefakt ("Found 0 artifact(s)").
  pripremi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  objavi:
    needs: pripremi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - name: Objavi na GitHub Pages
        id: objava
        uses: actions/deploy-pages@v4
